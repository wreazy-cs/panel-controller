# ---------------------------------------------------------------- Hata kodları
pc.PC-101.title=JS kaynağında ASCII dışı karakter
pc.PC-101.meaning=Panel dosyayı tek baytlık kodlamayla saklar ve HTML karakter kodlarını çözer. JS içindeki Türkçe harf kaydederken bozulabilir; bozuk bir JS dosyası sitedeki tüm betikleri durdurur.
pc.PC-101.fix=Harfi \\uXXXX ile yaz (ç = \\u00e7, ğ = \\u011f, ı = \\u0131, ö = \\u00f6, ş = \\u015f, ü = \\u00fc).
pc.PC-102.title=Kaynakta HTML karakter kodu
pc.PC-102.meaning=Panel kaydederken &#39; gibi kodları gerçek karaktere çevirir. JS içinde bu bir tırnağı kapatır ve dosya bozulur (03.08.2026'da sitenin tüm JS'i bu yüzden çalışmadı).
pc.PC-102.fix=Kodu kaldır: karakteri doğrudan yaz, JS'te \\u kaçışı kullan.
pc.PC-103.title=Panelin saklayamayacağı karakter
pc.PC-103.meaning=Panel windows-1254 kullanır. ≤, →, emoji gibi karakterler kaydedince ? olur.
pc.PC-103.fix=≤ yerine <=, → yerine -> yaz; emoji ve akıllı tırnakları kaldır.
pc.PC-104.title=Parçanın ilk satırında meta satırı yok
pc.PC-104.meaning=Her parça /*@vt <no> | <başlık> | ezer: <neyi ezdiği> */ satırıyla başlamalı. Numara, kuralın hangi parçadan geldiğini bulmak için kullanılır.
pc.PC-104.fix=Dosyanın en üstüne meta satırı ekle; numara diğer parçalarla çakışmasın.
pc.PC-105.title=Aynı parça numarası iki kez kullanılmış
pc.PC-105.meaning=Parça numaraları tüm slotlarda tek olmalı.
pc.PC-105.fix=Parçalardan birine kullanılmayan bir numara ver.
pc.PC-106.title=JS parçası ; ile bitmiyor
pc.PC-106.meaning=Parçalar birleştirilince sondaki ifade bir sonraki parçanın başıyla birleşip hataya dönüşebilir.
pc.PC-106.fix=Parçanın son ifadesinin sonuna ; koy.
pc.PC-107.title=JS'te satıra yayılan metin ya da ters tırnak
pc.PC-107.meaning=Panel kopyasında satır başlarındaki boşluklar silinir. Birden çok satıra yayılan metin ya da `...` şablonu bu yüzden değişir.
pc.PC-107.fix=Metni tek satırda tut ya da + ile birleştir; ters tırnak yerine tek ya da çift tırnak kullan.
pc.PC-108.title=CSS sıkıştırma denetimi tutmadı
pc.PC-108.meaning=Sıkıştırılmış CSS yeniden okununca kaynakla aynı kuralları vermedi. Anlamı değişmiş olabilecek bir dosya panele gitmesin diye derleme durur.
pc.PC-108.fix=Parçadaki alışılmadık yazımı (iç içe yorum, kapanmamış tırnak) düzelt. Sürerse hatayı bildir.
pc.PC-109.title=CSS okunamadı
pc.PC-109.meaning=Kapanmayan bir { ya da bitmemiş bir ifade var.
pc.PC-109.fix=Parçadaki süslü parantezleri ve tırnakları eşleştir.
pc.PC-110.title=Panel kopyasında yorum kaldı
pc.PC-110.meaning=Tema dosyaları CDN'den herkese açık okunur; açıklamalar yalnızca kaynakta kalmalı.
pc.PC-110.fix=Hatayı bildir: yorum silme bu dosyada çalışmamış.
pc.PC-111.title=Toplam karakter bütçesi aşıldı
pc.PC-111.meaning=Panelin toplam kayıt sınırı yaklaşık 355.000 karakter. Aşılırsa panel kaydetmeyebilir.
pc.PC-111.fix=Kullanılmayan kuralları sil ya da sayfaya özel kodu sayfa slotlarına taşı.
pc.PC-112.title=Slot hedefi aşıldı
pc.PC-112.meaning=Slot başına hedef 65.000 karakter. Panelin bunu zorladığı doğrulanmadı; uyarıdır.
pc.PC-112.fix=Mümkünse sayfaya özel kodu ilgili sayfa slotuna taşı.
pc.PC-201.title=Çıktıda HTML karakter kodu
pc.PC-201.meaning=Panel bu kodu çözer ve dosyayı bozar (bkz. PC-102).
pc.PC-201.fix=Kaynaktaki kodu kaldırıp yeniden derle.
pc.PC-202.title=Çıktıda panelin saklayamayacağı karakter
pc.PC-202.meaning=Kaydedince ? olur (bkz. PC-103).
pc.PC-202.fix=Kaynakta karakteri değiştirip yeniden derle.
pc.PC-203.title=JS sözdizimi hatalı
pc.PC-203.meaning=Node.js dosyanın panel kaydettikten sonraki halinde hata buldu. Bu dosya yüklenirse sitedeki betikler çalışmaz.
pc.PC-203.fix=Hatanın satırına bak, kaynağı düzeltip yeniden derle.
pc.PC-204.title=Çıktıda yorum var
pc.PC-204.meaning=Dosyalar CDN'den herkese açık okunur (bkz. PC-110).
pc.PC-204.fix=Yeniden derle; sürerse hatayı bildir.
pc.PC-205.title=CSS süslü parantezleri dengesiz
pc.PC-205.meaning={ ve } sayısı eşit değil; bir kuraldan sonrası tümüyle yok sayılabilir.
pc.PC-205.fix=Kaynağı düzeltip yeniden derle.
pc.PC-206.title=CSS yorum işaretleri dengesiz
pc.PC-206.meaning=/* ve */ sayısı eşit değil; dosyanın geri kalanı yorum sanılabilir.
pc.PC-206.fix=Kaynağı düzeltip yeniden derle.
pc.PC-207.title=Çıktıdaki JS'te ASCII dışı karakter
pc.PC-207.meaning=Yorum içindeyse sorun değil; metin içindeyse panel bozabilir.
pc.PC-207.fix=Metin içindeyse \\u kaçışı kullan.
pc.PC-208.title=Node.js bulunamadı
pc.PC-208.meaning=JS sözdizimi denetimi atlandı; diğer denetimler yapıldı.
pc.PC-208.fix=Ayarlar > Sistem kontrolü'nden Node.js'i kur ve uygulamayı yeniden aç.
pc.PC-209.title=Çıktı klasörü boş
pc.PC-209.meaning=Doğrulanacak dosya yok.
pc.PC-209.fix=Önce Derle.
pc.PC-301.title=Mağaza CDN adresi girilmemiş
pc.PC-301.meaning=Yedek ve canlı karşılaştırma için canlı dosyaların adresi gerekir.
pc.PC-301.fix=Ayarlar > Proje > Mağaza CDN adresi alanını doldur (örnek: https://platincdn.com/1234/tema/%s).
pc.PC-302.title=Canlı dosya okunamadı
pc.PC-302.meaning=CDN yanıt vermedi ya da hata döndürdü: internet bağlantısı, adres ya da CDN sorunu.
pc.PC-302.fix=İnternet bağlantısını ve Ayarlar'daki CDN adresini kontrol et, sonra yeniden dene.
pc.PC-303.title=Yedek eksik
pc.PC-303.meaning=Bazı canlı dosyalar indirilemedi. Yedeksiz yüklemeden sonra bir sorun çıkarsa geri dönülemez.
pc.PC-303.fix=Bağlantıyı düzeltip yeniden yedek al; yedek tamamlanmadan panele yükleme yapma.
pc.PC-304.title=Canlıdan farklı
pc.PC-304.meaning=Yerel çıktı canlıdakiyle aynı değil: henüz yüklenmedi ya da önbellek eski sürümü gösteriyor.
pc.PC-304.fix=Sihirbazla yükle. Yükledikten sonra hâlâ farklıysa önce önbelleği kontrol et (Ctrl+Shift+R, gizli sekme).
pc.PC-305.title=Yerelde yok, canlıda var
pc.PC-305.meaning=Canlıda içerik olan bir slotun yerel çıktısı yok.
pc.PC-305.fix=Slot gerçekten boşalacaksa panelde de boşalt; değilse kaynakları kontrol et.
pc.PC-401.title=Proje bir git deposu değil
pc.PC-401.meaning=Commit ve push için proje klasörü git ile izlenmeli.
pc.PC-401.fix=Klasörü git ile başlat ya da doğru proje klasörünü seç.
pc.PC-402.title=Commit için dosya seçilmedi
pc.PC-402.meaning=Hangi değişikliklerin commit'e gireceği seçilmeli.
pc.PC-402.fix=Listeden en az bir dosya işaretle.
pc.PC-403.title=Commit mesajı boş
pc.PC-403.meaning=Mesaj neyin değiştiğini söyler; tarih ve saat otomatik eklenir.
pc.PC-403.fix=Kısa bir açıklama yaz.
pc.PC-404.title=Commit yapılamadı
pc.PC-404.meaning=git commit hata döndürdü. Nedeni ayrıntılı çıktıda yazar (örneğin kullanıcı adı ayarlı değil).
pc.PC-404.fix=Ayrıntılı çıktıya bak; gerekirse git config user.name ve user.email ayarla.
pc.PC-405.title=Push durduruldu: derleme ya da doğrulama temiz değil
pc.PC-405.meaning=Hatalı kod GitHub'a gitmesin diye push öncesi derle ve doğrula çalışır; biri başarısız olunca push yapılmaz.
pc.PC-405.fix=İşlem kartındaki hatayı düzeltip yeniden dene.
pc.PC-406.title=Push yapılamadı
pc.PC-406.meaning=GitHub değişikliği kabul etmedi ya da bağlantı kurulamadı (yetki, ağ ya da uzakta yeni commit).
pc.PC-406.fix=Ayrıntılı çıktıya bak. rejected yazıyorsa önce uzak değişiklikleri çekmek gerekir.
pc.PC-407.title=git bulunamadı
pc.PC-407.meaning=Bilgisayarda git kurulu değil ya da PATH'te değil.
pc.PC-407.fix=Ayarlar > Sistem kontrolü'nden git'i kur.
pc.PC-901.title=Beklenmeyen hata
pc.PC-901.meaning=Uygulamada öngörülmemiş bir durum oluştu. Ayrıntı hata günlüğüne yazıldı.
pc.PC-901.fix=Ayarlar > Hata günlüğünü aç; dosyayı ekleyerek bildir.
