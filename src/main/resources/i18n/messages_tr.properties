about.purpose.1=Panel Controller, PlatinMarket mağazasının tema CSS ve JS dosyalarını panele yapıştırmadan önce denetler ve değişiklikleri git ile kaydeder.
about.purpose.2=Canlı dosyaların yedeğini alır, kaynak parçaları panelin istediği dosyalara derler, panelin kaydederken bozacağı şeyleri önceden bulur, yerel dosyaları canlıdakilerle karşılaştırır ve hangi dosyanın hangi sırayla yapıştırılacağını gösterir.
about.purpose.3=Panele yükleme elle yapılır. PlatinMarket API'sinde (Reform API) tema CSS ve JS dosyaları için bir uç nokta yok; bu yüzden otomatik yükleme yapılamıyor.
