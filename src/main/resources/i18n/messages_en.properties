# ---------------------------------------------------------------- About
about.title=About
about.subtitle=Version, release notes and licence.
about.madeBy=Made by {0}
about.tagline=Checks and git for PlatinMarket themes
about.openGuide=Open user guide
about.what=What it does
about.purpose.1=Panel Controller checks a PlatinMarket store's theme CSS and JS files before they are pasted into the panel, and records the changes with git.
about.purpose.2=It backs up the live files, builds the source pieces into the files the panel accepts, finds what the panel would break on save, compares local files with the live ones and shows which file to paste and in which order.
about.purpose.3=Uploading to the panel is manual. The PlatinMarket API (Reform API) has no endpoint for theme CSS and JS files, so automatic upload is not possible.
