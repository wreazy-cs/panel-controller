# ---------------------------------------------------------------- Error codes
pc.PC-101.title=Non-ASCII character in a JS source
pc.PC-101.meaning=The panel stores files in a single-byte encoding and decodes HTML character codes. A Turkish letter in JS can break on save, and a broken JS file stops every script on the site.
pc.PC-101.fix=Write the letter as \\uXXXX (ç = \\u00e7, ğ = \\u011f, ı = \\u0131, ö = \\u00f6, ş = \\u015f, ü = \\u00fc).
pc.PC-102.title=HTML character code in a source
pc.PC-102.meaning=On save the panel turns codes like &#39; into real characters. In JS that closes a quote and breaks the file (on 03.08.2026 the whole site lost its JS because of this).
pc.PC-102.fix=Remove the code: write the character itself, or use a \\u escape in JS.
pc.PC-103.title=Character the panel cannot store
pc.PC-103.meaning=The panel uses windows-1254. Characters such as ≤, → or emoji turn into ? on save.
pc.PC-103.fix=Write <= for ≤ and -> for →; remove emoji and smart quotes.
pc.PC-104.title=No meta line at the top of a piece
pc.PC-104.meaning=Every piece starts with /*@vt <no> | <title> | ezer: <what it overrides> */. The number shows which piece a rule came from.
pc.PC-104.fix=Add the meta line at the top; the number must not clash with other pieces.
pc.PC-105.title=Piece number used twice
pc.PC-105.meaning=Piece numbers must be unique across all slots.
pc.PC-105.fix=Give one of the pieces an unused number.
pc.PC-106.title=JS piece does not end with ;
pc.PC-106.meaning=When pieces are joined, the last statement can merge with the start of the next piece and break.
pc.PC-106.fix=End the piece's last statement with ;.
pc.PC-107.title=Multi-line string or backtick in JS
pc.PC-107.meaning=The panel copy strips leading spaces from every line, which changes a string spread over several lines or a `...` template.
pc.PC-107.fix=Keep the string on one line or join with +; use single or double quotes instead of backticks.
pc.PC-108.title=CSS compression check failed
pc.PC-108.meaning=The compressed CSS, read again, did not give the same rules as the source. The build stops so a file whose meaning may have changed never reaches the panel.
pc.PC-108.fix=Fix unusual syntax in the piece (nested comment, unclosed quote). Report it if it persists.
pc.PC-109.title=CSS could not be read
pc.PC-109.meaning=There is an unclosed { or an unfinished statement.
pc.PC-109.fix=Match the braces and quotes in the piece.
pc.PC-110.title=Comment left in the panel copy
pc.PC-110.meaning=Theme files are publicly readable from the CDN; comments belong in the sources only.
pc.PC-110.fix=Report it: comment removal did not work for this file.
pc.PC-111.title=Total character budget exceeded
pc.PC-111.meaning=The panel's total limit is about 355,000 characters. Above it the panel may not save.
pc.PC-111.fix=Delete unused rules or move page-specific code to the page slots.
pc.PC-112.title=Slot target exceeded
pc.PC-112.meaning=The target per slot is 65,000 characters. It is not confirmed that the panel enforces it; this is a warning.
pc.PC-112.fix=If possible, move page-specific code to its page slot.
pc.PC-201.title=HTML character code in the output
pc.PC-201.meaning=The panel decodes it and breaks the file (see PC-102).
pc.PC-201.fix=Remove the code from the source and build again.
pc.PC-202.title=Character in the output the panel cannot store
pc.PC-202.meaning=It turns into ? on save (see PC-103).
pc.PC-202.fix=Change the character in the source and build again.
pc.PC-203.title=JS syntax error
pc.PC-203.meaning=Node.js found an error in the file as the panel would save it. If uploaded, the site's scripts stop working.
pc.PC-203.fix=Check the reported line, fix the source and build again.
pc.PC-204.title=Comment in the output
pc.PC-204.meaning=The files are publicly readable from the CDN (see PC-110).
pc.PC-204.fix=Build again; report it if it persists.
pc.PC-205.title=Unbalanced CSS braces
pc.PC-205.meaning=The number of { and } differs; everything after a rule may be ignored.
pc.PC-205.fix=Fix the source and build again.
pc.PC-206.title=Unbalanced CSS comment markers
pc.PC-206.meaning=The number of /* and */ differs; the rest of the file may be read as a comment.
pc.PC-206.fix=Fix the source and build again.
pc.PC-207.title=Non-ASCII character in the JS output
pc.PC-207.meaning=Harmless inside a comment; inside a string the panel may break it.
pc.PC-207.fix=Inside a string, use a \\u escape.
pc.PC-208.title=Node.js not found
pc.PC-208.meaning=The JS syntax check was skipped; the other checks ran.
pc.PC-208.fix=Install Node.js from Settings > System check and restart the app.
pc.PC-209.title=Output folder is empty
pc.PC-209.meaning=There is nothing to validate.
pc.PC-209.fix=Build first.
pc.PC-301.title=No store CDN address
pc.PC-301.meaning=Backup and live comparison need the address of the live files.
pc.PC-301.fix=Fill in Settings > Project > Store CDN address (e.g. https://platincdn.com/1234/tema/%s).
pc.PC-302.title=Live file could not be read
pc.PC-302.meaning=The CDN did not answer or returned an error: internet connection, address or CDN problem.
pc.PC-302.fix=Check the internet connection and the CDN address in Settings, then try again.
pc.PC-303.title=Backup incomplete
pc.PC-303.meaning=Some live files could not be downloaded. Without a backup there is no way back if an upload goes wrong.
pc.PC-303.fix=Fix the connection and back up again; do not upload before the backup is complete.
pc.PC-304.title=Different from live
pc.PC-304.meaning=The local output differs from the live file: not uploaded yet, or the cache still shows an older version.
pc.PC-304.fix=Upload with the wizard. If it still differs after uploading, check the cache first (Ctrl+Shift+R, private window).
pc.PC-305.title=Missing locally, present live
pc.PC-305.meaning=A slot has content on the live site but no local output.
pc.PC-305.fix=If the slot should be empty, empty it in the panel too; otherwise check the sources.
pc.PC-401.title=The project is not a git repository
pc.PC-401.meaning=Commit and push need the project folder tracked by git.
pc.PC-401.fix=Initialise git in the folder or choose the right project folder.
pc.PC-402.title=No file selected for the commit
pc.PC-402.meaning=Choose which changes go into the commit.
pc.PC-402.fix=Tick at least one file.
pc.PC-403.title=Empty commit message
pc.PC-403.meaning=The message says what changed; date and time are added.
pc.PC-403.fix=Write a short description.
pc.PC-404.title=Commit failed
pc.PC-404.meaning=git commit returned an error. The full output says why (for example no user name set).
pc.PC-404.fix=Check the full output; set git config user.name and user.email if needed.
pc.PC-405.title=Push stopped: build or validation not clean
pc.PC-405.meaning=Build and validate run before a push so broken code does not reach GitHub; if one fails, nothing is pushed.
pc.PC-405.fix=Fix the problem shown on the activity card and try again.
pc.PC-406.title=Push failed
pc.PC-406.meaning=GitHub did not accept the push or could not be reached (permission, network, or new commits on the remote).
pc.PC-406.fix=Check the full output. If it says rejected, pull the remote changes first.
pc.PC-407.title=git not found
pc.PC-407.meaning=git is not installed or not on the PATH.
pc.PC-407.fix=Install git from Settings > System check.
pc.PC-901.title=Unexpected error
pc.PC-901.meaning=Something happened that the app did not expect. Details were written to the error log.
pc.PC-901.fix=Open the error log from Settings and report it with the file attached.
